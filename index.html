<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DOOM 2.5D — Single File</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Consolas,monospace}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#000;cursor:crosshair}
#start{
position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle,#261b18 0%,#090909 55%,#000 100%);
color:#eee;text-align:center;z-index:10;user-select:none
}
#panel{padding:28px 34px;border:2px solid #6e4f43;background:rgba(0,0,0,.72);box-shadow:0 0 40px #000}
#panel h1{margin:0 0 10px;font-size:34px;letter-spacing:4px;color:#d8c0a6}
#panel p{margin:7px 0;color:#bbb;font-size:14px;line-height:1.6}
#panel b{color:#fff}
#panel .go{margin-top:18px;font-size:16px;color:#e4c36b}
#msg{
position:fixed;left:50%;top:25%;transform:translate(-50%,-50%);
font-size:28px;font-weight:bold;color:#fff;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:3
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="start">
  <div id="panel">
    <h1>DOOM 2.5D</h1>
    <p><b>WASD</b> 이동 · <b>SHIFT</b> 달리기 · <b>마우스</b> 시점</p>
    <p><b>클릭</b> 사격 · <b>R</b> 재장전 · <b>1/2</b> 권총/샷건 · <b>E</b> 문 열기</p>
    <p><b>M</b> 미니맵 · <b>ESC</b> 마우스 해제</p>
    <p class="go">화면 클릭해서 시작</p>
  </div>
</div>
<div id="msg"></div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});
const start=document.getElementById("start");
const msg=document.getElementById("msg");

const VIEW_W=480, VIEW_H=270;
const view=document.createElement("canvas");
view.width=VIEW_W; view.height=VIEW_H;
const g=view.getContext("2d",{alpha:false});
g.imageSmoothingEnabled=false;

function resize(){
  canvas.width=innerWidth; canvas.height=innerHeight;
  ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resize); resize();

const MAP_RAW=[
"11111111111111111111",
"1....2.....D........1",
"1....2.....1........1",
"1....2.....1..333...1",
"1....2222221..3.3...1",
"1...........1..3.3...1",
"1...........D..3.3...1",
"1..1111....11..3.3...1",
"1..1..1........3.3...1",
"1..1..D........333...1",
"1..1..1..............1",
"1..1111....22222.....1",
"1..........2...2.....1",
"1..4444....2...2.....1",
"1..4..4....2...2.....1",
"1..4..D....22222.....1",
"1..4..4..............1",
"1..4444..............1",
"1....................1",
"11111111111111111111"
];
const MW=MAP_RAW[0].length, MH=MAP_RAW.length;
const FOV=Math.PI/3;
const MAX_RAY=30;
const PLAYER_R=.22;
const keys=Object.create(null);

const doors=new Map();
for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
  if(MAP_RAW[y][x]==="D") doors.set(x+","+y,{open:0,target:0});
}

function tile(x,y){
  const ix=Math.floor(x),iy=Math.floor(y);
  if(ix<0||iy<0||ix>=MW||iy>=MH) return "1";
  const c=MAP_RAW[iy][ix];
  if(c==="D"){
    const d=doors.get(ix+","+iy);
    if(d && d.open>.88) return ".";
    return "D";
  }
  return c;
}
function solid(x,y){ return tile(x,y)!=="."; }

const textures={};
function makeTex(base,accent,kind){
  const c=document.createElement("canvas"); c.width=c.height=64;
  const t=c.getContext("2d");
  t.fillStyle=base; t.fillRect(0,0,64,64);
  if(kind==="brick"){
    t.fillStyle=accent;
    for(let y=0;y<64;y+=16){
      const off=(y/16)%2?8:0;
      for(let x=-off;x<64;x+=16){
        t.fillRect(x,y,15,2); t.fillRect(x,y,2,16);
      }
    }
    t.fillStyle="rgba(255,255,255,.04)";
    for(let i=0;i<130;i++) t.fillRect(Math.random()*64,Math.random()*64,1,1);
  }else if(kind==="metal"){
    t.fillStyle=accent;
    for(let y=0;y<64;y+=16) t.fillRect(0,y,64,2);
    for(let x=0;x<64;x+=16) t.fillRect(x,0,2,64);
    t.fillStyle="#1d1f22";
    for(let y=8;y<64;y+=16) for(let x=8;x<64;x+=16) t.fillRect(x-1,y-1,3,3);
  }else if(kind==="tech"){
    t.fillStyle=accent;
    for(let y=4;y<64;y+=12){
      t.fillRect(4,y,56,5);
      t.fillStyle="rgba(255,255,255,.08)"; t.fillRect(5,y+1,54,1);
      t.fillStyle=accent;
    }
  }else{
    t.fillStyle=accent;
    for(let i=0;i<64;i+=8) t.fillRect(i,0,2,64);
    for(let i=0;i<64;i+=8) t.fillRect(0,i,64,2);
  }
  return c;
}
textures["1"]=makeTex("#6b2c28","#2b1210","brick");
textures["2"]=makeTex("#575b60","#22272b","metal");
textures["3"]=makeTex("#2f5571","#162f44","tech");
textures["4"]=makeTex("#5a4932","#2a2014","brick");
textures["D"]=makeTex("#6a624e","#24211a","metal");

let audioCtx=null;
function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function tone(freq,dur,type="square",vol=.035,slide=0){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), a=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audioCtx.currentTime+dur);
  a.gain.setValueAtTime(vol,audioCtx.currentTime);
  a.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(a); a.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
function noise(dur=.08,vol=.05){
  if(!audioCtx) return;
  const len=Math.floor(audioCtx.sampleRate*dur), b=audioCtx.createBuffer(1,len,audioCtx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=audioCtx.createBufferSource(), a=audioCtx.createGain();
  s.buffer=b; a.gain.value=vol; s.connect(a); a.connect(audioCtx.destination); s.start();
}

const weaponDefs={
 pistol:{name:"PISTOL",mag:12,reserve:72,damage:1,pellets:1,spread:.012,rate:.22,reload:1.0,recoil:.055},
 shotgun:{name:"SHOTGUN",mag:6,reserve:30,damage:1,pellets:7,spread:.055,rate:.72,reload:1.45,recoil:.13}
};

let state, enemies, pickups, projectiles, particles;
function resetGame(){
  state={
    px:2.5,py:2.5,pa:0,vx:0,vy:0,
    hp:100,armor:0,
    stamina:100,
    weapon:"pistol",
    ammo:{pistol:12,shotgun:6},
    reserve:{pistol:72,shotgun:24},
    fireCD:0,reloadT:0,reloading:false,
    recoil:0,muzzle:0,weaponKick:0,
    bob:0,bobAmt:0,stepT:0,
    hurt:0,dead:false,won:false,
    score:0,kills:0,
    showMap:false,
    damageDir:0
  };
  doors.forEach(d=>{d.open=0;d.target=0;});
  enemies=[
    E(8.5,2.5,2),E(15.5,2.5,2),E(13.5,7.5,2),E(5.5,10.5,3),
    E(10.5,13.5,2),E(16.5,15.5,3),E(7.5,17.2,2)
  ];
  pickups=[
    P(4.5,3.5,"ammo"),P(9.5,8.5,"health"),P(14.5,4.5,"armor"),
    P(6.5,14.5,"shell"),P(17.2,10.5,"health"),P(12.5,17,"ammo")
  ];
  projectiles=[];
  particles=[];
  msg.textContent="";
}
function E(x,y,hp){return{x,y,hp,maxHp:hp,alive:true,think:0,attack:Math.random(),flash:0,hurt:0,dir:0,speed:.65+Math.random()*.15}}
function P(x,y,type){return{x,y,type,active:true,bob:Math.random()*6}}
resetGame();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function canMove(x,y,r=PLAYER_R){
  return !solid(x-r,y-r)&&!solid(x+r,y-r)&&!solid(x-r,y+r)&&!solid(x+r,y+r);
}

function tryMove(dx,dy){
  let nx=state.px+dx, ny=state.py+dy;
  if(canMove(nx,state.py)) state.px=nx; else state.vx*=.25;
  if(canMove(state.px,ny)) state.py=ny; else state.vy*=.25;
}

function lineClear(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,dist=Math.hypot(dx,dy),n=Math.ceil(dist/.08);
  for(let i=1;i<n;i++){const t=i/n;if(solid(ax+dx*t,ay+dy*t))return false}
  return true;
}

function castRay(angle){
  const rayDirX=Math.cos(angle), rayDirY=Math.sin(angle);
  let mapX=Math.floor(state.px), mapY=Math.floor(state.py);
  const deltaX=Math.abs(1/(rayDirX||1e-9)), deltaY=Math.abs(1/(rayDirY||1e-9));
  let stepX,stepY,sideX,sideY;
  if(rayDirX<0){stepX=-1;sideX=(state.px-mapX)*deltaX}else{stepX=1;sideX=(mapX+1-state.px)*deltaX}
  if(rayDirY<0){stepY=-1;sideY=(state.py-mapY)*deltaY}else{stepY=1;sideY=(mapY+1-state.py)*deltaY}
  let side=0,hit="1",steps=0;
  while(steps++<80){
    if(sideX<sideY){sideX+=deltaX;mapX+=stepX;side=0}else{sideY+=deltaY;mapY+=stepY;side=1}
    hit=tile(mapX+.5,mapY+.5);
    if(hit!==".") break;
  }
  let dist;
  if(side===0) dist=(mapX-state.px+(1-stepX)/2)/(rayDirX||1e-9);
  else dist=(mapY-state.py+(1-stepY)/2)/(rayDirY||1e-9);
  dist=Math.max(.001,dist);

  let wallX=side===0?state.py+dist*rayDirY:state.px+dist*rayDirX;
  wallX-=Math.floor(wallX);
  if(side===0&&rayDirX>0)wallX=1-wallX;
  if(side===1&&rayDirY<0)wallX=1-wallX;
  return{dist,side,tile:hit,wallX,mapX,mapY};
}

const zbuf=new Float32Array(VIEW_W);

function worldRender(){
  const horizon=VIEW_H/2 + state.bobAmt*1.7 + state.recoil*VIEW_H*.6;

  const sky=g.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,"#05070a"); sky.addColorStop(1,"#24211f");
  g.fillStyle=sky; g.fillRect(0,0,VIEW_W,horizon);

  const floor=g.createLinearGradient(0,horizon,0,VIEW_H);
  floor.addColorStop(0,"#33312d"); floor.addColorStop(1,"#080808");
  g.fillStyle=floor; g.fillRect(0,horizon,VIEW_W,VIEW_H-horizon);

  for(let x=0;x<VIEW_W;x++){
    const a=state.pa-FOV/2+(x/VIEW_W)*FOV;
    const h=castRay(a);
    const d=h.dist*Math.cos(a-state.pa);
    zbuf[x]=d;
    const wallH=Math.min(VIEW_H*5,VIEW_H/d);
    const y0=horizon-wallH/2;
    const tex=textures[h.tile]||textures["1"];
    const tx=Math.floor(h.wallX*63);
    let shade=clamp(1-d/MAX_RAY,.15,1)*(h.side?.72:1);
    g.globalAlpha=1;
    g.drawImage(tex,tx,0,1,64,x,Math.floor(y0),1,Math.ceil(wallH));
    if(shade<.98){
      g.fillStyle=`rgba(0,0,0,${1-shade})`;
      g.fillRect(x,Math.floor(y0),1,Math.ceil(wallH));
    }
  }
  g.globalAlpha=1;
  renderPickups(horizon);
  renderEnemies(horizon);
  renderProjectiles(horizon);
  renderParticles();
  renderWeapon();
  renderHUD();
}

function project(x,y,horizon){
  const dx=x-state.px,dy=y-state.py,dist=Math.hypot(dx,dy),ang=norm(Math.atan2(dy,dx)-state.pa);
  if(Math.abs(ang)>FOV*.68)return null;
  const cd=dist*Math.cos(ang);
  const sx=(.5+ang/FOV)*VIEW_W;
  const scale=VIEW_H/Math.max(.01,cd);
  return{dist,cd,sx,scale};
}

function renderPickups(h){
  const list=pickups.filter(p=>p.active).map(p=>({p,pr:project(p.x,p.y,h)})).filter(o=>o.pr).sort((a,b)=>b.pr.cd-a.pr.cd);
  for(const {p,pr} of list){
    const size=clamp(pr.scale*.28,4,48), left=pr.sx-size/2, y=h+pr.scale*.28+Math.sin(performance.now()*.004+p.bob)*2-size;
    for(let sx=Math.floor(left);sx<left+size;sx++){
      if(sx<0||sx>=VIEW_W||pr.cd>=zbuf[sx])continue;
      const rel=(sx-left)/size;
      let col="#55b8ff";
      if(p.type==="health")col="#e04a4a";
      if(p.type==="armor")col="#4f81ff";
      if(p.type==="shell")col="#d7a452";
      g.fillStyle=col;
      const edge=Math.abs(rel-.5);
      const hh=size*(edge>.42?.55:1);
      g.fillRect(sx,y+(size-hh),1,hh);
    }
    if(pr.cd<4){
      g.font="8px monospace";g.textAlign="center";g.fillStyle="rgba(255,255,255,.65)";
      const label=p.type==="health"?"MED":p.type==="armor"?"ARMOR":p.type==="shell"?"SHELL":"AMMO";
      g.fillText(label,pr.sx,y-2);
    }
  }
  g.textAlign="left";
}

function renderEnemies(h){
  const list=enemies.filter(e=>e.alive).map(e=>({e,pr:project(e.x,e.y,h)})).filter(o=>o.pr).sort((a,b)=>b.pr.cd-a.pr.cd);
  for(const {e,pr} of list){
    const size=clamp(pr.scale*.78,6,VIEW_H*1.3), left=pr.sx-size/2, top=h-size*.52;
    for(let sx=Math.floor(left);sx<left+size;sx++){
      if(sx<0||sx>=VIEW_W||pr.cd>=zbuf[sx])continue;
      const u=(sx-left)/size, d=Math.abs(u-.5);
      if(d>.46)continue;
      let y1=top+size*.20,y2=top+size*.94;
      if(d>.31){y1=top+size*.39;y2=top+size*.78}
      const sh=clamp(1-pr.cd/MAX_RAY,.28,1);
      let body=e.hurt>0?`rgb(${Math.floor(255*sh)},${Math.floor(110*sh)},${Math.floor(95*sh)})`:`rgb(${Math.floor(150*sh)},${Math.floor(55*sh)},${Math.floor(45*sh)})`;
      g.fillStyle=body;g.fillRect(sx,y1,1,y2-y1);
      if(d<.24){g.fillStyle=`rgb(${Math.floor(110*sh)},${Math.floor(30*sh)},${Math.floor(28*sh)})`;g.fillRect(sx,top+size*.06,1,size*.31)}
    }
    if(pr.cd<10){
      g.fillStyle="#ffd45b";
      const ew=Math.max(1,size*.035);
      g.fillRect(pr.sx-size*.095,top+size*.17,ew,ew);
      g.fillRect(pr.sx+size*.06,top+size*.17,ew,ew);
    }
    if(e.flash>0&&pr.cd<12){
      g.fillStyle="#fff4b4";g.fillRect(pr.sx-2,top+size*.31,4,5);
    }
  }
}

function renderProjectiles(h){
  for(const b of projectiles){
    const pr=project(b.x,b.y,h);if(!pr)continue;
    const s=clamp(pr.scale*.07,2,10),x=Math.floor(pr.sx-s/2),y=Math.floor(h-pr.scale*.02-s/2);
    if(pr.sx>=0&&pr.sx<VIEW_W&&pr.cd<zbuf[clamp(pr.sx|0,0,VIEW_W-1)]){
      g.fillStyle="#ffda58";g.fillRect(x,y,s,s);
      g.fillStyle="rgba(255,120,20,.35)";g.fillRect(x-2,y-2,s+4,s+4);
    }
  }
}

function renderParticles(){
  for(const p of particles){
    if(p.type==="screen"){
      g.fillStyle=`rgba(${p.r},${p.g},${p.b},${p.a})`;g.fillRect(p.x,p.y,p.s,p.s);
    }
  }
}

function renderWeapon(){
  const move=Math.hypot(state.vx,state.vy);
  const swayX=Math.sin(state.bob*.5)*state.bobAmt*2.1;
  const swayY=Math.abs(Math.cos(state.bob))*state.bobAmt*1.8;
  const recoil=state.weaponKick*36;
  const cx=VIEW_W/2+swayX, base=VIEW_H+5+swayY+recoil;
  if(state.weapon==="pistol"){
    g.fillStyle="#735844";g.fillRect(cx-26,base-28,16,28);g.fillRect(cx+10,base-28,16,28);
    g.fillStyle="#3b3f42";g.fillRect(cx-11,base-58,22,52);
    g.fillStyle="#777d80";g.fillRect(cx-7,base-72,14,24);
    g.fillStyle="#1b1c1e";g.fillRect(cx-5,base-75,10,6);
  }else{
    g.fillStyle="#6d503e";g.fillRect(cx-44,base-30,25,30);g.fillRect(cx+20,base-30,25,30);
    g.fillStyle="#5a3c27";g.fillRect(cx-21,base-54,42,22);
    g.fillStyle="#383b3d";g.fillRect(cx-9,base-92,18,45);
    g.fillStyle="#777b7d";g.fillRect(cx-6,base-95,12,28);
  }
  if(state.muzzle>0){
    g.fillStyle="#fff0a0";
    g.beginPath();g.moveTo(cx,base-(state.weapon==="pistol"?88:111));
    g.lineTo(cx-13,base-(state.weapon==="pistol"?70:94));
    g.lineTo(cx-4,base-(state.weapon==="pistol"?73:98));
    g.lineTo(cx,base-(state.weapon==="pistol"?61:89));
    g.lineTo(cx+5,base-(state.weapon==="pistol"?73:98));
    g.lineTo(cx+13,base-(state.weapon==="pistol"?70:94));g.fill();
  }
  if(state.reloading){
    g.fillStyle="rgba(255,255,255,.8)";g.font="9px monospace";g.textAlign="center";
    g.fillText("RELOADING",VIEW_W/2,VIEW_H-34);g.textAlign="left";
  }
}

function renderHUD(){
  g.fillStyle="rgba(0,0,0,.76)";g.fillRect(0,VIEW_H-28,VIEW_W,28);
  g.font="10px monospace";g.textBaseline="middle";
  g.fillStyle="#fff";
  g.fillText("HP",8,VIEW_H-14);g.fillStyle="#d7473f";g.fillRect(28,VIEW_H-19,70,9);g.fillStyle="#7d1612";g.fillRect(28,VIEW_H-19,70*(state.hp/100),9);
  g.fillStyle="#fff";g.fillText(String(Math.ceil(state.hp)).padStart(3,"0"),102,VIEW_H-14);
  g.fillText("ARM",137,VIEW_H-14);g.fillStyle="#3763b8";g.fillRect(165,VIEW_H-19,55,9);g.fillStyle="#729bff";g.fillRect(165,VIEW_H-19,55*(state.armor/100),9);
  g.fillStyle="#fff";g.fillText(state.weapon.toUpperCase(),235,VIEW_H-14);
  g.fillText(`${state.ammo[state.weapon]}/${state.reserve[state.weapon]}`,315,VIEW_H-14);
  g.fillText(`K ${state.kills}/${enemies.length}`,397,VIEW_H-14);

  // stamina
  g.fillStyle="rgba(0,0,0,.45)";g.fillRect(8,8,82,6);
  g.fillStyle="#c6b46b";g.fillRect(9,9,80*(state.stamina/100),4);

  // crosshair
  g.fillStyle="rgba(255,255,255,.82)";
  g.fillRect(VIEW_W/2-6,VIEW_H/2,4,1);g.fillRect(VIEW_W/2+3,VIEW_H/2,4,1);
  g.fillRect(VIEW_W/2,VIEW_H/2-6,1,4);g.fillRect(VIEW_W/2,VIEW_H/2+3,1,4);

  if(state.showMap) drawMap();

  if(state.hurt>0){
    g.fillStyle=`rgba(180,0,0,${Math.min(.48,state.hurt)})`;g.fillRect(0,0,VIEW_W,VIEW_H);
  }
  if(state.dead||state.won){
    g.fillStyle="rgba(0,0,0,.58)";g.fillRect(0,0,VIEW_W,VIEW_H);
    g.font="24px monospace";g.textAlign="center";g.fillStyle="#fff";
    g.fillText(state.dead?"YOU DIED":"AREA CLEARED",VIEW_W/2,VIEW_H/2-10);
    g.font="10px monospace";g.fillText("ENTER TO RESTART",VIEW_W/2,VIEW_H/2+16);g.textAlign="left";
  }
}

function drawMap(){
  const s=5,ox=VIEW_W-MW*s-8,oy=8;
  g.fillStyle="rgba(0,0,0,.65)";g.fillRect(ox-4,oy-4,MW*s+8,MH*s+8);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const c=MAP_RAW[y][x];
    if(c!=="."){
      g.fillStyle=c==="D"?"#b29b64":"#666";g.fillRect(ox+x*s,oy+y*s,s-1,s-1);
    }
  }
  for(const e of enemies)if(e.alive){g.fillStyle="#c43a35";g.fillRect(ox+e.x*s-1,oy+e.y*s-1,3,3)}
  for(const p of pickups)if(p.active){g.fillStyle="#50a8df";g.fillRect(ox+p.x*s-1,oy+p.y*s-1,2,2)}
  g.fillStyle="#fff";g.fillRect(ox+state.px*s-2,oy+state.py*s-2,4,4);
  g.strokeStyle="#fff";g.beginPath();g.moveTo(ox+state.px*s,oy+state.py*s);g.lineTo(ox+(state.px+Math.cos(state.pa)*1.5)*s,oy+(state.py+Math.sin(state.pa)*1.5)*s);g.stroke();
}

function interact(){
  if(state.dead||state.won)return;
  let best=null;
  doors.forEach((d,k)=>{
    const [x,y]=k.split(",").map(Number),cx=x+.5,cy=y+.5;
    const dist=Math.hypot(cx-state.px,cy-state.py);
    const ang=Math.abs(norm(Math.atan2(cy-state.py,cx-state.px)-state.pa));
    if(dist<1.65&&ang<.7&&(!best||dist<best.dist))best={d,dist};
  });
  if(best){
    best.d.target=best.d.target>.5?0:1;
    tone(best.d.target?220:150,.15,"square",.025,best.d.target?80:-40);
  }
}

function beginReload(){
  if(state.reloading||state.dead||state.won)return;
  const w=state.weapon,def=weaponDefs[w];
  if(state.ammo[w]>=def.mag||state.reserve[w]<=0)return;
  state.reloading=true;state.reloadT=def.reload;
  tone(160,.08,"square",.025,40);
}
function finishReload(){
  const w=state.weapon,def=weaponDefs[w],need=def.mag-state.ammo[w],take=Math.min(need,state.reserve[w]);
  state.ammo[w]+=take;state.reserve[w]-=take;state.reloading=false;
  tone(260,.06,"square",.025,-30);
}

function switchWeapon(w){
  if(!weaponDefs[w]||state.weapon===w)return;
  state.weapon=w;state.reloading=false;state.reloadT=0;state.weaponKick=.25;
  tone(180,.06,"square",.02,80);
}

function shoot(){
  initAudio();
  if(state.dead||state.won||state.fireCD>0||state.reloading)return;
  const w=state.weapon,def=weaponDefs[w];
  if(state.ammo[w]<=0){tone(90,.07,"square",.025,-15);beginReload();return}
  state.ammo[w]--;state.fireCD=def.rate;state.muzzle=.055;state.weaponKick=1;state.recoil+=def.recoil;
  if(w==="shotgun"){noise(.13,.075);tone(95,.12,"sawtooth",.045,-30)}else{noise(.055,.05);tone(170,.06,"square",.03,-70)}

  for(let p=0;p<def.pellets;p++){
    const a=state.pa+(Math.random()*2-1)*def.spread;
    let hitEnemy=null,hitDist=999;
    for(const e of enemies){
      if(!e.alive)continue;
      const dx=e.x-state.px,dy=e.y-state.py,dist=Math.hypot(dx,dy),ang=Math.abs(norm(Math.atan2(dy,dx)-a));
      const cone=Math.atan(.33/Math.max(.3,dist));
      if(ang<cone&&dist<hitDist&&lineClear(state.px,state.py,e.x,e.y)){hitEnemy=e;hitDist=dist}
    }
    const wh=castRay(a);
    if(hitEnemy&&hitDist<wh.dist+.15){
      hitEnemy.hp-=def.damage;hitEnemy.hurt=.16;
      if(hitEnemy.hp<=0){hitEnemy.alive=false;state.kills++;state.score+=100;noise(.05,.03)}
    }
  }
}

function updatePlayer(dt){
  let ix=0,iy=0;
  if(keys["w"])iy+=1;if(keys["s"])iy-=1;if(keys["a"])ix-=1;if(keys["d"])ix+=1;
  const mag=Math.hypot(ix,iy)||1;ix/=mag;iy/=mag;
  let sprint=keys["shift"]&&iy>0&&state.stamina>1;
  const max=sprint?4.65:3.05,acc=sprint?18:14,fric=Math.pow(.0008,dt);

  if(sprint)state.stamina=Math.max(0,state.stamina-30*dt);else state.stamina=Math.min(100,state.stamina+18*dt);

  const fx=Math.cos(state.pa),fy=Math.sin(state.pa),rx=Math.cos(state.pa+Math.PI/2),ry=Math.sin(state.pa+Math.PI/2);
  const tx=(fx*iy+rx*ix)*max,ty=(fy*iy+ry*ix)*max;
  state.vx+=(tx-state.vx)*Math.min(1,acc*dt);state.vy+=(ty-state.vy)*Math.min(1,acc*dt);
  if(ix===0&&iy===0){state.vx*=fric;state.vy*=fric}
  tryMove(state.vx*dt,state.vy*dt);

  const speed=Math.hypot(state.vx,state.vy);
  state.bobAmt+=(clamp(speed/max,0,1)-state.bobAmt)*Math.min(1,10*dt);
  state.bob+=speed*dt*3.5;
  if(speed>.65){
    state.stepT-=dt;
    if(state.stepT<=0){state.stepT=sprint?.26:.38;tone(70+Math.random()*18,.025,"square",.01,-10)}
  }else state.stepT=0;

  state.recoil*=Math.pow(.015,dt);
  state.weaponKick*=Math.pow(.025,dt);
}

function updateDoors(dt){doors.forEach(d=>{d.open+=(d.target-d.open)*Math.min(1,4.8*dt)})}

function enemyHitPlayer(dmg,ang){
  let real=dmg;
  if(state.armor>0){const absorb=Math.min(state.armor,dmg*.55);state.armor-=absorb;real-=absorb}
  state.hp-=real;state.hurt=.42;state.damageDir=ang;noise(.06,.025);
  if(state.hp<=0){state.hp=0;state.dead=true;document.exitPointerLock?.()}
}

function updateEnemies(dt){
  if(state.dead||state.won)return;
  for(const e of enemies){
    if(!e.alive)continue;
    e.flash=Math.max(0,e.flash-dt);e.hurt=Math.max(0,e.hurt-dt);e.attack-=dt;e.think-=dt;
    const dx=state.px-e.x,dy=state.py-e.y,dist=Math.hypot(dx,dy),see=dist<10&&lineClear(e.x,e.y,state.px,state.py);
    if(see){
      const ang=Math.atan2(dy,dx);e.dir=ang;
      if(dist>2.35){
        const sp=e.speed*(dist<5?1.1:1);
        const vx=Math.cos(ang)*sp*dt,vy=Math.sin(ang)*sp*dt;
        const nx=e.x+vx,ny=e.y+vy;
        if(!solid(nx,e.y))e.x=nx;if(!solid(e.x,ny))e.y=ny;
      }else if(e.attack<=0){
        e.attack=.85+Math.random()*.45;e.flash=.08;
        tone(120,.06,"square",.018,-45);
        // projectile
        const sp=5.5,err=(Math.random()-.5)*.12;
        projectiles.push({x:e.x,y:e.y,vx:Math.cos(ang+err)*sp,vy:Math.sin(ang+err)*sp,life:2.2});
      }
    }
  }
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const b=projectiles[i];b.life-=dt;
    const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;
    if(solid(nx,ny)||b.life<=0){projectiles.splice(i,1);continue}
    b.x=nx;b.y=ny;
    if(Math.hypot(b.x-state.px,b.y-state.py)<.28){
      enemyHitPlayer(8,Math.atan2(b.y-state.py,b.x-state.px));
      projectiles.splice(i,1);
    }
  }
}

function updatePickups(){
  for(const p of pickups){
    if(!p.active)continue;
    if(Math.hypot(p.x-state.px,p.y-state.py)<.48){
      p.active=false;
      if(p.type==="health")state.hp=Math.min(100,state.hp+30);
      else if(p.type==="armor")state.armor=Math.min(100,state.armor+50);
      else if(p.type==="shell")state.reserve.shotgun+=12;
      else state.reserve.pistol+=24;
      tone(420,.08,"square",.025,120);
    }
  }
}

function update(dt){
  if((state.dead||state.won)&&keys["enter"]){resetGame();keys["enter"]=false;return}
  if(state.dead||state.won)return;
  updatePlayer(dt);updateDoors(dt);updateEnemies(dt);updateProjectiles(dt);updatePickups();
  state.fireCD=Math.max(0,state.fireCD-dt);state.muzzle=Math.max(0,state.muzzle-dt);state.hurt=Math.max(0,state.hurt-dt);
  if(state.reloading){state.reloadT-=dt;if(state.reloadT<=0)finishReload()}
  if(state.kills===enemies.length&&!state.won){state.won=true;msg.textContent="";document.exitPointerLock?.()}
}

let last=performance.now();
function frame(t){
  const dt=Math.min(.04,(t-last)/1000);last=t;
  update(dt);worldRender();
  const scale=Math.min(canvas.width/VIEW_W,canvas.height/VIEW_H);
  const dw=Math.floor(VIEW_W*scale),dh=Math.floor(VIEW_H*scale),dx=(canvas.width-dw)>>1,dy=(canvas.height-dh)>>1;
  ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(view,0,0,VIEW_W,VIEW_H,dx,dy,dw,dh);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function startGame(){
  initAudio();
  start.style.display="none";
  canvas.tabIndex=0;
  canvas.focus();
  try{
    if(document.pointerLockElement!==canvas && canvas.requestPointerLock){
      const r=canvas.requestPointerLock();
      if(r && typeof r.catch==="function") r.catch(()=>{});
    }
  }catch(_){}
}

start.addEventListener("click",startGame);

canvas.addEventListener("click",()=>{
  initAudio();
  if(start.style.display!=="none"){
    startGame();
    return;
  }
  if(document.pointerLockElement!==canvas){
    try{
      if(canvas.requestPointerLock){
        const r=canvas.requestPointerLock();
        if(r && typeof r.catch==="function") r.catch(()=>{});
      }
    }catch(_){}
    return;
  }
  shoot();
});
addEventListener("mousemove",e=>{
  if(document.pointerLockElement===canvas&&!state.dead&&!state.won){
    state.pa+=e.movementX*.00235;
  }
});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(k==="e")interact();
  if(k==="r")beginReload();
  if(k==="1")switchWeapon("pistol");
  if(k==="2")switchWeapon("shotgun");
  if(k==="m"){state.showMap=!state.showMap;e.preventDefault()}
  if(e.code==="Space"){shoot();e.preventDefault()}
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

})();
</script>
